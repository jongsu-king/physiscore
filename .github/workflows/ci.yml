name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PHYSISCORE_NO_UPDATE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest pyflakes && python -m pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python Physiscore_Launcher.py --selftest
      - run: python physiscore_cli.py sq 1.34
      - name: GUI smoke test (every window opens once)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a python tools/gui_smoke.py
